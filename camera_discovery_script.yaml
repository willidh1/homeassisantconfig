# ============================================
# INSTRUCTIONS
# ============================================
# 1. Copy the "discover_cameras" script above into your scripts.yaml
# 2. Restart Home Assistant
# 3. Go to Developer Tools → Services
# 4. Search for "script.discover_cameras"
# 5. Click "CALL SERVICE"
# 6. Check your phone notification
# 7. Go to Developer Tools → States
# 8. Search for "camera" to see all camera entities
# 9. Note down the entity IDs you find

